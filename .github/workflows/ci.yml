name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check development startup
        run: npm run test:dev

      - name: Check workshop and persistence
        run: |
          npm run test:workshop
          npm run test:versions
          npm run test:production

      - name: Check AI request contracts
        run: |
          npm run test:rules:api
          npm run test:cards:api

      - name: Build catalog API
        run: npm run build --workspace @turnbased/catalog-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build --workspace web
