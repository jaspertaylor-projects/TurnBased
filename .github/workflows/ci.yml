name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check development startup
        run: npm run test:dev

      - name: Build catalog API
        run: npm run build --workspace @turnbased/catalog-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
