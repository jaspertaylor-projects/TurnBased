name: turnbased-catalog

services:
  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bgmapi
    ports:
      - '127.0.0.1:${CATALOG_DB_PORT:-54328}:5432'
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bgmapi']
      interval: 2s
      timeout: 3s
      retries: 30

  catalog-redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${CATALOG_REDIS_PORT:-6380}:6379'
    volumes:
      - catalog_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  catalog_pgdata:
  catalog_redisdata:
